# ===== PHASE 0: connection-leak fixes =====
# open-in-view pinned an EntityManager for the whole request; combined with a
# blocking SMTP send it exhausted the Hikari pool (total=10, active=10, idle=0).
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.connection-timeout=10000

# Without these JavaMail waits forever on a stalled Gmail socket.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

